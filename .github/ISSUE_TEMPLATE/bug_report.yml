name: Bug report
description: Report a reproducible defect in MindCare
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve MindCare. Do not include personal health data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v3.0.0
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed personal and sensitive data.
          required: true